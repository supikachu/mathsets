[package]
name = "mathset"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
# join_all：Stage2 切块 N 路并发（借用 state / provider，无法用需要 'static 的 JoinSet）
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (Postgres)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal", "json"] }

# HTTP middleware
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# IDs & timestamps
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }

# Authentication
jsonwebtoken = "9"
bcrypt = "0.16"

# Error handling（强类型业务错误 — PermissionError 等）
thiserror = "1"

# Configuration
dotenvy = "0.15"

# AI 录入功能（reqwest 用 rustls-tls 避免 windows-sys/dlltool 原生依赖）
# M4：启用 multipart 特性以支持 MinerU 引擎的 multipart/form-data 文件上传
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
aes-gcm = "0.10"
base64 = "0.22"
regex = "1"
async-trait = "0.1"

# Multipart 文件类型嗅探（零信任安全防护 — Magic Number 校验）
infer = "0.16"

# 图像格式转码（Doc2X 仅支持 JPEG/PNG，前端上传的 WebP 需转码为 PNG）
# 解码面必须不窄于 PDF 出口的 `RENDERABLE` 清单：印前预检（T5.1）要用 `ImageReader::into_dimensions`
# 只读文件头拿像素尺寸，格式不认识就等于那张图没被检过
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }

# 并发限流中间件（parse-image 路由全局并发控制）
tower = { version = "0.5", features = ["limit"] }

# 并发字典（SSE 一次性票据存储）
dashmap = "6"

# tokio 流工具（broadcast → Stream 桥接 SSE）
tokio-stream = "0.1"
axum-extra = { version = "0.12.6", features = ["query"] }

# V2.1.1 题目去重 hash（content_hash / normalized_content_hash，SHA-256）
sha2 = "0.10"
# ZIP 解压（MinerU 云端 Precision API 返回 zip 包，内含 full.md）
zip = "2"

# 导出引擎 IR 类型 → TypeScript 绑定生成（frontend/src/api/types/exam.ts）
ts-rs = { version = "10", features = ["serde-json-impl", "uuid-impl"] }
# 导出公式管线：LaTeX → Presentation MathML（src/export/math）
latex2mathml = "0.2"
# R3：MathML 只读解析用 roxmltree，OMML 片段写出用 quick-xml（不引入通用 XML 模型）
roxmltree = "0.21.1"
quick-xml = "0.42.0"

# ── 排版系统（模块 B）：Typst 内核（T3.1）──────────────────────────────
# 版本按实施时 crates.io 稳定版锁定；升级要同步 typst / typst-layout / typst-pdf / typst-svg
# / typst-assets 五个同批发布的 crate，且核对 comemo 与 typst 传递依赖仍是同一主版本（否则 trait 签名对不上）
typst = "0.15.1"          # 编译器与 World trait
typst-layout = "0.15.1"   # PagedDocument / Page：定义在这个 crate，typst 门面没有把它导成 typst::layout
typst-pdf = "0.15.1"      # Document → PDF 字节（默认全字体内嵌）
typst-svg = "0.15.1"      # 逐页 SVG，供预览
typst-assets = { version = "0.15.1", features = ["fonts"] }
                          # 内嵌 New Computer Modern（拉丁/数学）+ DejaVu Sans Mono + Libertinus；
                          # `fonts` feature 默认关闭且依赖树里无人打开，不显式开启则
                          # typst_assets::fonts() 返回空迭代器，任何文档都没有字体可用。
                          # 中文字体不在其中，走 assets/fonts 运行时读（R6）
mitex = "0.2.4"           # LaTeX math → Typst math 源码，不依赖 typst 本体
mitex-spec-gen = "0.2.4"  # mitex 的命令表（DEFAULT_SPEC）：守卫靠它枚举「mitex 可能吐出哪些
                          # 标识符」。它本就是 mitex 的非 dev 依赖，已经在二进制里，不增加体积。
comemo = "0.5.1"          # typst 增量缓存的 peer 依赖
ecow = "0.2"              # typst 公开签名里的 Sm / Arc 字符串类型；必须跟 typst 的传递依赖同主版本
                          # （钉 0.3 会同时编进两份 ecow，`Sm` 变成两个不同类型，World 实现直接对不上）

[dev-dependencies]
# Axum 测试工具（oneshot 调用 Router）
tower = { version = "0.5", features = ["util"] }
# 使用真实数据库的测试
serde_json = "1"
