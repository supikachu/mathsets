[package]
name = "mathset"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (Postgres)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }

# HTTP middleware
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IDs & timestamps
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Authentication
jsonwebtoken = "9"
bcrypt = "0.16"

# Configuration
dotenvy = "0.15"

# AI 录入功能（reqwest 用 rustls-tls 避免 windows-sys/dlltool 原生依赖）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aes-gcm = "0.10"
base64 = "0.22"
regex = "1"
async-trait = "0.1"

# Multipart 文件类型嗅探（零信任安全防护 — Magic Number 校验）
infer = "0.16"

# 并发限流中间件（parse-image 路由全局并发控制）
tower = { version = "0.5", features = ["limit"] }

[dev-dependencies]
# Axum 测试工具（oneshot 调用 Router）
tower = { version = "0.5", features = ["util"] }
# 使用真实数据库的测试
serde_json = "1"
