      if name_part:\n                norm_file = file_part.replace(\"\\\\\\\\\", \"/\").lstrip(\"./\")\n                pats = [f\"%/{norm_file}\", f\"%{norm_file}%\"]\n                for pat in pats:\n                    cursor = await self._connection.execute(\n                        f\"\"\"\n                        SELECT id FROM entities\n                        WHERE name = ? AND\n                              LOWER(REPLACE(file_path, '\\\\\\\\', '/')) LIKE ?\n                              {type_filter}\n                        ORDER BY LENGTH(id) ASC\n                        LIMIT 10\n                        \"\"\",\n                        [name_part, pat.lower(), *params],\n                    )\n                    rows = await cursor.fetchall()\n                    if len(rows) == 1:\n                        return rows[0][0]\n                    elif len(rows) > 1:\n                        exact = await self._connection.execute(\n                            f\"\"\"\n                            SELECT id FROM entities\n                            WHERE name = ? AND\n                                  LOWER(REPLACE(file_path, '\\\\\\\\', '/')) = ?\n                                  {type_filter}\n                            ORDER BY LENGTH(id) ASC\n                            LIMIT 10\n                            \"\"\",\n                            [name_part, norm_file.lower(), *params],\n                        )\n                        exact_rows = await exact.fetchall()\n                        if exact_rows:\n                            return exact_rows[0][0]\n                        return rows[0][0]\n\n        # Try qualified_name suffix match\n        cursor = await self._connection.execute(\n            f\"\"\"\n            SELECT id FROM entities\n            WHERE qualified_name LIKE ?{type_filter}\n            ORDER BY LENGTH(id) ASC\n            LIMIT 10\n            \"\"\",\n            [f\"%{entity_id}\", *params],\n        )\n        rows = await cursor.fetchall()\n        if len(rows) == 1:\n            return rows[0][0]\n        elif len(rows) > 1:\n            # 多行同名（同一文件内重载/多个定义）：返回行号最小者而非放弃\n            return rows[0][0]\n\n        return None'''\n\nassert old in src, \"old block not found in graph.py\"\nsrc = src.replace(old, new)\nopen(path, 'w', encoding='utf-8').write(src)\nprint(\"graph.py resolve_entity_id patched OK\")\nPYEOF", "Bash=python - <<'PYEOF'\npath = r\"C:/Users/pikachu/AppData/Roaming/Python/Python311/site-packages/codegraph_mcp/core/graph.py\"\nsrc = open(path, encoding='utf-8').read()\n\nold = '''        # Text search with different matching strategies\n        if query.query:\n            base_sql += \" AND (name LIKE ? OR qualified_name LIKE ?)\"\n            params.extend([f\"%{query.query}%\", f\"%{query.query}%\"])\n\n        base_sql += f\" LIMIT {query.max_results * 2}\"  # Get more for scoring\n\n        cursor = await self._connection.execute(base_sql, params)\n        rows = await cursor.fetchall()\n\n        seen_ids: set[str] = set()\n        for row in rows:\n            entity = self._row_to_entity(row)\n            if entity.id not in seen_ids:\n                seen_ids.add(entity.id)\n                all_entities.append(entity)\n\n                # Calculate relevance score\n                score = self._calculate_relevance_score(\n                    entity, search_term\n                )\n                scores[entity.id] = score\n\n                # Track community\n                if len(row) > 10 and row[10] is not None:\n                    communities[entity.id] = row[10]'''\n\nnew = '''        # Text search: tokenize query and match across multiple fields\n        # (fix: 旧实现只对 name/qualified_name 做整句 LIKE 匹配，中文自然\n        # 语言查询必然落空。现按空白/标点分词，对 name / qualified_name /\n        # signature / docstring / file_path 多字段做 OR 匹配，中文注释可命中)\n        tokens = self._tokenize_query(query.query)\n        if tokens:\n            conditions = []\n            for token in tokens:\n                escaped = (\n                    token.replace(\"\\\\\\\\\", \"\\\\\\\\\\\\\\\\\")\n                    .replace(\"%\", \"\\\\\\\\%\")\n                    .replace(\"_\", \"\\\\\\\\_\")\n                )\n                pattern = f\"%{escaped}%\"\n                conditions.append(\n                    \"(LOWER(name) LIKE ? ESCAPE '\\\\\\\\' OR \"\n                    \"LOWER(qualified_name) LIKE ? ESCAPE '\\\\\\\\' OR \"\n                    \"LOWER(COALESCE(signature, '')) LIKE ? ESCAPE '\\\\\\\\' OR \"\n                    \"LOWER(COALESCE(docstring, '')) LIKE ? ESCAPE '\\\\\\\\' OR \"\n                    \"LOWER(file_path) LIKE ? ESCAPE '\\\\\\\\')\"\n                )\n                params.extend([pattern.lower()] * 5)\n            base_sql += \" AND (\" + \" OR \".join(conditions) + \")\"\n\n        base_sql += f\" LIMIT {query.max_results * 2}\"  # Get more for scoring\n\n        cursor = await self._connection.execute(base_sql, params)\n        rows = await cursor.fetchall()\n\n        seen_ids: set[str] = set()\n        for row in rows:\n            entity = self._row_to_entity(row)\n            if entity.id not in seen_ids:\n                seen_ids.add(entity.id)\n                all_entities.append(entity)\n\n                # Calculate relevance score\n                score = self._calculate_relevance_score(\n                    entity, search_term, tokens\n                )\n                scores[entity.id] = score\n\n                # Track community\n                if len(row) > 10 and row[10] is not None:\n                    communities[entity.id] = row[10]'''\n\nassert old in src, \"query block not found\"\nsrc = src.replace(old, new)\n\n# 在 _calculate_relevance_score 前插入 _tokenize_query 静态方法\nold2 = '''    def _calculate_relevance_score(\n        self, entity: Entity, search_term: str\n    ) -> float:\n        \"\"\"Calculate relevance score for an entity.\"\"\"\n        score = 0.0\n        name_lower = entity.name.lower()\n        qualified_lower = entity.qualified_name.lower()\n\n        # Exact name match: highest score\n        if name_lower == search_term:\n            score += 1.0\n        # Name starts with search term\n        elif name_lower.startswith(search_term):\n            score += 0.8\n        # Name contains search term\n        elif search_term in name_lower:\n            score += 0.6\n\n        # Qualified name bonus\n        if search_term in qualified_lower:\n            score += 0.2\n\n        # Entity type bonus (functions/classes are often more relevant)\n        if entity.type in (EntityType.FUNCTION, EntityType.CLASS):\n            score += 0.1\n\n        return min(score, 1.0)'''\n\nnew2 = '''    @staticmethod\n    def _tokenize_query(query: str) -> list[str]:\n        \"\"\"Split query into search tokens (supports Chinese + English).\"\"\"\n        if not query:\n            return []\n        import re\n        tokens = re.split(\n            r\"[\\\\s,;:!?。，；：！？、（）()\\\\[\\\\]{}\\\"'`~@#$%^&*+=|\\\\\\\\/<>]+\",\n            query,\n        )\n        return [t for t in tokens if t]\n\n    def _calculate_relevance_score(\n        self, entity: Entity, search_term: str, tokens: list[str] | None = None\n    ) -> float:\n        \"\"\"Calculate relevance score for an entity.\"\"\"\n        score = 0.0\n        name_lower = entity.name.lower()\n        qualified_lower = entity.qualified_name.lower()\n        doc_lower = (entity.docstring or \"\").lower()\n        sig_lower = (entity.signature or \"\").lower()\n\n        if tokens:\n            # Token-based scoring (fix: 分词评分，中文查询可命中 docstring)\n            for token in tokens:\n                if token in name_lower:\n                    score += 0.6\n                elif token in qualified_lower:\n                    score += 0.3\n                if token in sig_lower:\n                    score += 0.2\n                if token in doc_lower:\n                    score += 0.15\n                if token in str(entity.file_path).lower():\n                    score += 0.1\n            return min(score, 1.0)\n\n        # Exact name match: highest score\n        if name_lower == search_term:\n            score += 1.0\n        # Name starts with search term\n        elif name_lower.startswith(search_term):\n            score += 0.8\n        # Name contains search term\n        elif search_term in name_lower:\n            score += 0.6\n\n        # Qualified name bonus\n        if search_term in qualified_lower:\n            score += 0.2\n\n        # Entity type bonus (functions/classes are often more relevant)\n        if entity.type in (EntityType.FUNCTION, EntityType.CLASS):\n            score += 0.1\n\n        return min(score, 1.0)'''\n\nassert old2 in src, \"_calculate_relevance_score block not found\"\nsrc = src.replace(old2, new2)\nopen(path, 'w', encoding='utf-8').write(src)\nprint(\"graph.py query() patched OK\")\nPYEOF", "Bash=python - <<'PYEOF'\npath = r\"C:/Users/pikachu/AppData/Roaming/Python/Python311/site-packages/codegraph_mcp/core/community.py\"\nsrc = open(path, encoding='utf-8').read()\n\nold = '''    async def _store_communities(\n        self,\n        engine: Any,\n        communities: list[Community],\n    ) -> None:\n        \"\"\"Store communities in database (batch optimized).\"\"\"\n        # Clear existing communities\n        await engine._connection.execute(\"DELETE FROM communities\")\n\n        # Batch insert communities\n        community_data = [\n            (c.id, c.level, c.name, c.summary, c.member_count)\n            for c in communities\n        ]\n        await engine._connection.executemany(\n            \"\"\"\n            INSERT INTO communities (id, level, name, summary, member_count)\n            VALUES (?, ?, ?, ?, ?)\n            \"\"\",\n            community_data,\n        )'''\n\nnew = '''    async def _store_communities(\n        self,\n        engine: Any,\n        communities: list[Community],\n    ) -> None:\n        \"\"\"Store communities in database (batch optimized).\n\n        (fix: 旧实现直接把 name=None / summary=None 写库，导致 GraphRAG\n        global_search 拿到的社区名/摘要全为空。现在为每个社区生成：\n        name = 成员最集中的模块/目录；summary = 规则化统计摘要)\n        \"\"\"\n        # Clear existing communities\n        await engine._connection.execute(\"DELETE FROM communities\")\n\n        # 预取成员实体信息，用于生成 name 与 summary\n        member_rows = await self._fetch_member_rows(engine, communities)\n        self._enrich_communities(communities, member_rows)\n\n        # Batch insert communities\n        community_data = [\n            (c.id, c.level, c.name, c.summary, c.member_count)\n            for c in communities\n        ]\n        await engine._connection.executemany(\n            \"\"\"\n            INSERT INTO communities (id, level, name, summary, member_count)\n            VALUES (?, ?, ?, ?, ?)\n            \"\"\",\n            community_data,\n        )'''\n\nassert old in src, \"_store_communities block not found\"\nsrc = src.replace(old, new)\n\n# 在 _store_communities 之后（_update_incremental 之前）插入辅助方法\nold2 = '''    async def update_incremental('''\nnew2 = '''    async def _fetch_member_rows(\n        self,\n        engine: Any,\n        communities: list[Community],\n    ) -> dict[int, list[tuple]]:\n        \"\"\"Fetch member entity info (id, type, name, file_path) for communities.\"\"\"\n        member_rows: dict[int, list[tuple]] = {}\n        all_ids = [mid for c in communities for mid in c.member_ids]\n        if not all_ids:\n            return member_rows\n        placeholders = \",\".join(\"?\" * len(all_ids))\n        cursor = await engine._connection.execute(\n            f\"\"\"\n            SELECT id, type, name, file_path FROM entities\n            WHERE id IN ({placeholders})\n            \"\"\",\n            all_ids,\n        )\n        rows = await cursor.fetchall()\n        id_to_row = {r[0]: r for r in rows}\n        for c in communities:\n            member_rows[c.id] = [id_to_row[m] for m in c.member_ids if m in id_to_row]\n        return member_rows\n\n    def _enrich_communities(\n        self,\n        communities: list[Community],\n        member_rows: dict[int, list[tuple]],\n    ) -> None:\n        \"\"\"Generate name and rule-based summary for communities.\"\"\"\n        from collections import Counter\n        from pathlib import Path\n\n        repo = Path(str(getattr(self, \"_repo_path\", \"\"))) if hasattr(self, \"_repo_path\") else None\n\n        for c in communities:\n            rows = member_rows.get(c.id, [])\n            if not rows:\n                c.name = c.name or f\"Community {c.id}\"\n                c.summary = c.summary or \"Empty community\"\n                continue\n\n            # --- name: 成员最集中的目录（最多两级） ---\n            if not c.name:\n                dir_counter: Counter[str] = Counter()\n                for row in rows:\n                    fp = row[3] or \"\"\n                    p = Path(fp.replace(\"\\\\\\\\\", \"/\"))\n                    parts = [x for x in p.parts if x]\n                    # 去掉盘符/仓库根前缀，取倒数两级目录\n                    tail = parts[-2:] if len(parts) >= 2 else parts\n                    dir_counter[\"/\".join(tail)] += 1\n                if dir_counter:\n                    c.name = dir_counter.most_common(1)[0][0]\n                else:\n                    c.name = f\"Community {c.id}\"\n\n            # --- summary: 规则化统计摘要（同 semantic.SemanticAnalyzer） ---\n            if not c.summary:\n                type_counts: Counter[str] = Counter()\n                names: list[str] = []\n                for row in rows:\n                    type_counts[row[1] or \"unknown\"] += 1\n                    names.append(row[2] or \"\")\n                parts = [\n                    f\"{count} {t}(s)\"\n                    for t, count in sorted(type_counts.items(), key=lambda x: -x[1])\n                ]\n                summary = f\"Community with {', '.join(parts)}.\"\n                if names:\n                    key_names = names[:5]\n                    summary += f\" Key entities: {', '.join(key_names)}\"\n                    if len(names) > 5:\n                        summary += f\" and {len(names) - 5} more.\"\n                c.summary = summary\n\n    async def update_incremental('''\n\nassert old2 in src, \"update_incremental anchor not found\"\nsrc = src.replace(old2, new2, 1)\nopen(path, 'w', encoding='utf-8').write(src)\nprint(\"community.py patched OK\")\nPYEOF", "Bash=python - <<'PYEOF'\npath = r\"C:/Users/pikachu/AppData/Roaming/Python/Python311/site-packages/codegraph_mcp/core/graphrag.py\"\nsrc = open(path, encoding='utf-8').read()\n\nold = '''    async def _find_relevant_communities(\n        self,\n        query: str,\n        communities: list[dict[str, Any]],\n    ) -> list[dict[str, Any]]:\n        \"\"\"Find communities relevant to the query.\"\"\"\n        query_lower = query.lower()\n        query_words = set(query_lower.split())\n\n        scored = []\n        for comm in communities:\n            score = 0.0\n\n            # Match against name\n            if comm.get(\"name\"):\n                name_lower = comm[\"name\"].lower()\n                if any(word in name_lower for word in query_words):\n                    score += 0.5\n\n            # Match against summary\n            if comm.get(\"summary\"):\n                summary_lower = comm[\"summary\"].lower()\n                matching_words = sum(\n                    1 for word in query_words if word in summary_lower\n                )\n                score += matching_words * 0.2\n\n            if score > 0:\n                comm[\"score\"] = min(score, 1.0)\n                scored.append(comm)\n\n        # Sort by score\n        scored.sort(key=lambda x: -x.get(\"score\", 0))\n\n        # If no matches, return top communities by size\n        if not scored and communities:\n            for comm in communities[: self.max_communities]:\n                comm[\"score\"] = 0.3\n                scored.append(comm)\n\n        return scored[: self.max_communities]'''\n\nnew = '''    def _tokenize_query(self, query: str) -> list[str]:\n        \"\"\"Split query into search tokens (Chinese + English).\"\"\"\n        if not query:\n            return []\n        import re\n        tokens = re.split(\n            r\"[\\\\s,;:!?。，；：！？、（）()\\\\[\\\\]{}\\\"'`~@#$%^&*+=|\\\\\\\\/<>]+\",\n            query.lower(),\n        )\n        return [t for t in tokens if t]\n\n    async def _find_relevant_communities(\n        self,\n        query: str,\n        communities: list[dict[str, Any]],\n    ) -> list[dict[str, Any]]:\n        \"\"\"Find communities relevant to the query.\n\n        (fix: 旧实现按整句 whitespace 切词，中文查询整句作为一个词，\n        对英文社区名/摘要无法命中。现按标点分词后逐词 substring 匹配，\n        中英文关键词均可命中；'None'/NULL 摘要视为无摘要)\n        \"\"\"\n        query_words = self._tokenize_query(query)\n\n        scored = []\n        for comm in communities:\n            score = 0.0\n\n            # Match against name\n            name_raw = comm.get(\"name\") or \"\"\n            if name_raw and name_raw not in (\"None\", \"null\"):\n                name_lower = name_raw.lower()\n                for word in query_words:\n                    if word and word in name_lower:\n                        score += 0.5\n                        break\n\n            # Match against summary\n            summary_raw = comm.get(\"summary\") or \"\"\n            if summary_raw and summary_raw not in (\"None\", \"null\"):\n                summary_lower = summary_raw.lower()\n                matching_words = sum(\n                    1 for word in query_words if word and word in summary_lower\n                )\n                score += matching_words * 0.2\n\n            if score > 0:\n                comm[\"score\"] = min(score, 1.0)\n                scored.append(comm)\n\n        # Sort by score\n        scored.sort(key=lambda x: -x.get(\"score\", 0))\n\n        # If no matches, return top communities by size\n        if not scored and communities:\n            for comm in communities[: self.max_communities]:\n                comm[\"score\"] = 0.3\n                scored.append(comm)\n\n        return scored[: self.max_communities]'''\n\nassert old in src, \"_find_relevant_communities block not found\"\nsrc = src.replace(old, new)\n\n# _get_communities_with_summaries: 'None' 字符串防御（直接置空，由上层跳过）\nold2 = '''        return [\n            {\n                \"id\": row[0],\n                \"level\": row[1],\n                \"name\": row[2],\n                \"summary\": row[3],\n                \"member_count\": row[4],\n            }\n            for row in rows\n        ]'''\nnew2 = '''        def _clean(value: Any) -> Any:\n            # (fix: 旧库中 summary/name 可能被写成字符串 'None'，视为空)\n            if value is None:\n                return None\n            if isinstance(value, str) and value.strip().lower() in (\"none\", \"null\", \"\"):\n                return None\n            return value\n\n        return [\n            {\n                \"id\": row[0],\n                \"level\": row[1],\n                \"name\": _clean(row[2]),\n                \"summary\": _clean(row[3]),\n                \"member_count\": row[4],\n            }\n            for row in rows\n        ]'''\n\nassert old2 in src, \"communities rows block not found\"\nsrc = src.replace(old2, new2)\nopen(path, 'w', encoding='utf-8').write(src)\nprint(\"graphrag.py patched OK\")\nPYEOF", "Bash=python - <<'PYEOF'\npath = r\"C:/Users/pikachu/AppData/Roaming/Python/Python311/site-packages/codegraph_mcp/mcp/tools.py\"\nsrc = open(path, encoding='utf-8').read()\n\n# 1) _handle_analyze_module: 路径规范化查询\nold = '''async def _handle_analyze_module(\n    args: dict[str, Any],\n    engine: Any,\n    config: Config,\n) -> dict[str, Any]:\n    \"\"\"Handle analyze_module_structure tool.\"\"\"\n    file_path = args[\"file_path\"]\n\n    cursor = await engine._connection.execute(\n        \"SELECT type, name, start_line, end_line FROM entities WHERE file_path = ?\",\n        (file_path,),\n    )\n    rows = await cursor.fetchall()\n\n    return {\n        \"file\": file_path,\n        \"entities\": [\n            {\"type\": row[0], \"name\": row[1], \"lines\": f\"{row[2]}-{row[3]}\"}\n            for row in rows\n        ],\n    }'''\n\nnew = '''async def _handle_analyze_module(\n    args: dict[str, Any],\n    engine: Any,\n    config: Config,\n) -> dict[str, Any]:\n    \"\"\"Handle analyze_module_structure tool.\n\n    (fix: 旧实现直接拿传入路径与 DB 的 file_path 做精确比较，而索引库中\n    存的是绝对路径（Windows 反斜杠），相对路径查询永远返回空。\n    现在统一做路径校验 + 解析为绝对路径，并大小写/分隔符不敏感匹配)\n    \"\"\"\n    file_path = _validate_path(args[\"file_path\"], config.repo_path)\n    if file_path is None:\n        return {\"error\": \"Invalid path: access denied outside repository\"}\n\n    normalized = str(file_path).replace(\"\\\\\\\\\", \"/\").lower()\n\n    cursor = await engine._connection.execute(\n        \"\"\"\n        SELECT type, name, start_line, end_line FROM entities\n        WHERE LOWER(REPLACE(file_path, '\\\\\\\\', '/')) = ?\n        ORDER BY start_line ASC\n        \"\"\",\n        (normalized,),\n    )\n    rows = await cursor.fetchall()\n\n    return {\n        \"file\": args[\"file_path\"],\n        \"entities\": [\n            {\"type\": row[0], \"name\": row[1], \"lines\": f\"{row[2]}-{row[3]}\"}\n            for row in rows\n        ],\n    }'''\n\nassert old in src, \"analyze_module block not found\"\nsrc = src.replace(old, new)\n\n# 2) _handle_get_file_structure: 去掉 relative_to，直接交给 _handle_analyze_module 规范化\nold2 = '''async def _handle_get_file_structure(\n    args: dict[str, Any],\n    engine: Any,\n    config: Config,\n) -> dict[str, Any]:\n    \"\"\"Handle get_file_structure tool with path validation.\"\"\"\n    file_path = _validate_path(args[\"file_path\"], config.repo_path)\n    if file_path is None:\n        return {\"error\": \"Invalid path: access denied outside repository\"}\n\n    # Use validated path for analysis\n    validated_args = {**args, \"file_path\": str(file_path.relative_to(config.repo_path))}\n    return await _handle_analyze_module(validated_args, engine, config)'''\n\nnew2 = '''async def _handle_get_file_structure(\n    args: dict[str, Any],\n    engine: Any,\n    config: Config,\n) -> dict[str, Any]:\n    \"\"\"Handle get_file_structure tool with path validation.\n\n    (fix: 旧实现把路径 relative_to(repo) 转成相对路径再查库，但索引库\n    存的是绝对路径，导致永远匹配为空。现在直接传绝对路径，由\n    _handle_analyze_module 内部做规范化匹配)\n    \"\"\"\n    file_path = _validate_path(args[\"file_path\"], config.repo_path)\n    if file_path is None:\n        return {\"error\": \"Invalid path: access denied outside repository\"}\n\n    # 绝对路径与相对路径均可命中（_handle_analyze_module 内部规范化）\n    validated_args = {**args, \"file_path\": str(file_path)}\n    return await _handle_analyze_module(validated_args, engine, config)'''\n\nassert old2 in src, \"get_file_structure block not found\"\nsrc = src.replace(old2, new2)\n\n# 3) _handle_reindex: 触发社区检测\nold3 = '''async def _handle_reindex(\n    args: dict[str, Any],\n    engine: Any,\n    config: Config,\n) -> dict[str, Any]:\n    \"\"\"Handle reindex_repository tool.\"\"\"\n    from codegraph_mcp.core.indexer import Indexer\n\n    indexer = Indexer()\n    result = await indexer.index_repository(\n        config.repo_path,\n        incremental=args.get(\"incremental\", True),\n    )\n\n    return {\n        \"entities\": result.entities_count,\n        \"relations\": result.relations_count,\n        \"files\": result.files_indexed,\n        \"duration\": result.duration_seconds,\n    }'''\n\nnew3 = '''async def _handle_reindex(\n    args: dict[str, Any],\n    engine: Any,\n    config: Config,\n) -> dict[str, Any]:\n    \"\"\"Handle reindex_repository tool.\n\n    (fix: 旧实现 reindex 后不更新社区，导致 global_search 使用陈旧/空\n    摘要的社区数据。现在索引完成后自动重跑社区检测并生成 name/summary)\n    \"\"\"\n    from codegraph_mcp.core.community import CommunityDetector\n    from codegraph_mcp.core.graph import GraphEngine\n    from codegraph_mcp.core.indexer import Indexer\n\n    indexer = Indexer()\n    result = await indexer.index_repository(\n        config.repo_path,\n        incremental=args.get(\"incremental\", True),\n    )\n\n    # 社区检测：变更少走增量更新，否则全量重检测\n    community_count = 0\n    try:\n        community_engine = GraphEngine(config.repo_path)\n        await community_engine.initialize()\n        try:\n            detector = CommunityDetector()\n            if result.changed_entity_ids:\n                comm_result = await detector.update_incremental(\n                    community_engine, result.changed_entity_ids\n                )\n            else:\n                comm_result = await detector.detect(community_engine)\n            community_count = len(comm_result.communities)\n        finally:\n            await community_engine.close()\n    except Exception as e:\n        logger.warning(f\"Community detection after reindex failed: {e}\")\n\n    return {\n        \"entities\": result.entities_count,\n        \"relations\": result.relations_count,\n        \"files\": result.files_indexed,\n        \"duration\": result.duration_seconds,\n        \"communities\": community_count,\n    }'''\n\nassert old3 in src, \"reindex block not found\"\nsrc = src.replace(old3, new3)\nopen(path, 'w', encoding='utf-8').write(src)\nprint(\"tools.py patched OK\")\nPYEOF", "Bash=python -m py_compile \\\n  \"C:/Users/pikachu/AppData/Roaming/Python/Python311/site-packages/codegraph_mcp/core/graph.py\" \\\n  \"C:/Users/pikachu/AppData/Roaming/Python/Python311/site-packages/codegraph_mcp/core/community.py\" \\\n  \"C:/Users/pikachu/AppData/Roaming/Python/Python311/site-packages/codegraph_mcp/core/graphrag.py\" \\\n  \"C:/Users/pikachu/AppData/Roaming/Python/Python311/site-packages/codegraph_mcp/mcp/tools.py\" \\\n  && echo \"=== 语法检查通过 ===\"", "Bash=cd \"C:/Users/pikachu/Desktop/mathset\" && python .codegraph/fix/patch1.py && python -m py_co